<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App di Lorenzo Veglia</title>
  <style>
    :root { --ink:#0b0b0d; --ink2:#16161a; --paper:#f2f2f4; --mute:#a0a0aa; --accent:#ffd60a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--ink); color:var(--paper); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; }
    main { max-width:760px; margin:0 auto; padding:40px 22px 80px; }
    h1 { font-size:clamp(28px,6vw,40px); margin:0 0 6px; }
    .meta { color:var(--mute); font-size:14px; margin-bottom:24px; }
    a { color:var(--accent); }
    .app { background:var(--ink2); border:1px solid rgba(255,214,10,.22); border-radius:14px; padding:16px 18px; margin:14px 0; }
    .app h2 { margin:0 0 4px; font-size:20px; }
    .app p { margin:0 0 8px; color:var(--mute); }
    footer { color:var(--mute); font-size:13px; margin-top:40px; border-top:1px solid rgba(255,255,255,.1); padding-top:16px; }
  </style>
</head>
<body>
<main>
  <h1>Lorenzo Veglia</h1>
  <p class="meta">App per iPhone · Apps for iPhone</p>

  <div class="app">
    <h2>FullScreen: Scroll Display LED</h2>
    <p>Tabellone luminoso a tutto schermo · Full-screen LED sign</p>
    <a href="/fullscreen-privacy/">Info</a> ·
    <a href="/fullscreen-privacy/privacy-policy.html">Privacy</a> ·
    <a href="/fullscreen-privacy/supporto.html">Supporto / Support</a>
  </div>

  <footer>Contatti / Contact: <a href="mailto:lolokrk@gmail.com">lolokrk@gmail.com</a></footer>
</main>
</body>
</html>
